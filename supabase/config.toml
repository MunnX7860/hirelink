# Minimal local-dev config for the Supabase CLI (docs/12 §3).
# Full reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "hirelink"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

# Google provider is configured per-environment (dashboard or CLI env) — docs/12 §6.
[auth.external.google]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""
